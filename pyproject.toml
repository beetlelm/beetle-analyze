[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beetle-analyze"
version = "0.1.0"
description = "Interpretability and evaluation analysis suite for the Beetle language models, plus a minimal reproducible BLiMP-style analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Suchir Salhan" }]
keywords = [
    "language-models", "interpretability", "evaluation", "BLiMP",
    "minimal-pairs", "multilingual", "MECO", "FLORES", "reproducible",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The full analysis suite (analyze/, evals/, finetune/, slt/) drives trained
# language-model checkpoints, so it needs the real ML stack. These are the
# dependencies the core modules import directly. Heavier / specialised
# dependencies live under [project.optional-dependencies] below.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.16",
    "huggingface-hub>=0.20",
    "accelerate>=0.27",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "requests>=2.31",
    "protobuf>=3.20",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
# Statistics: mixed-effects models, multiple-comparison corrections.
stats = ["statsmodels>=0.14"]
# Eye-tracking / reading-time analyses (MECO L1/L2).
eyetracking = ["minicons>=0.3", "rdata>=0.11", "wordfreq>=3.0"]
# Instruction / LoRA fine-tuning pipeline (finetune/).
sft = ["trl>=0.9", "peft>=0.10"]
# Sparse autoencoders (analyze/sae/).
saes = ["einops>=0.7"]
# Brain-encoding analyses (analyze/brain/).
brain = ["nilearn>=0.10", "mne>=1.6"]
# Dimensionality reduction and figure labelling.
viz = ["umap-learn>=0.5", "adjustText>=1.0"]
# SLT geometry analyses (slt/).
geometry = ["xarray>=2023.10", "zarr>=2.16"]
# Excel I/O (AoA standardisation) and spaCy pipelines.
io = ["openpyxl>=3.1"]
nlp = ["spacy>=3.7"]
# Development: tests + the toy quickstart only need the light stack.
dev = ["pytest>=7.4", "matplotlib>=3.7"]
all = [
    "statsmodels>=0.14", "minicons>=0.3", "rdata>=0.11", "wordfreq>=3.0",
    "trl>=0.9", "peft>=0.10", "einops>=0.7", "nilearn>=0.10", "mne>=1.6",
    "umap-learn>=0.5", "adjustText>=1.0", "xarray>=2023.10", "zarr>=2.16",
    "openpyxl>=3.1", "spacy>=3.7",
]

[project.urls]
Homepage = "https://github.com/BeetleLM/beetle-analyze"
Repository = "https://github.com/BeetleLM/beetle-analyze"
Issues = "https://github.com/BeetleLM/beetle-analyze/issues"

[project.scripts]
# Minimal, self-contained headline analysis (runs on CPU, no downloads).
beetle-analyze = "beetle_analyze.cli:main"
# Full research CLIs (require the ML stack, data, and often a GPU at runtime).
beetle-cka = "analyze.xling.cka_curriculum:main"
beetle-probe = "analyze.xling.probe_alignment:main"
beetle-baseline = "analyze.xling.external_baseline:main"
beetle-dev-trajectory = "analyze.xling.dev_trajectory:main"
beetle-cognate-filter = "analyze.xling.cognate_filter:main"
beetle-byte-normalize = "analyze.byte_normalize:main"
beetle-units-localize = "analyze.units.localize:main"
beetle-units-ablate = "analyze.units.ablate:main"
beetle-units-trajectory = "analyze.units.trajectory:main"

[tool.setuptools]
py-modules = ["models", "utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analyze*", "evals*", "finetune*", "slt*", "beetle_analyze*"]
exclude = [
    "tests*", "scripts*", "legacy*", "notebooks*", "baselines*",
    "build*", "dist*", "__pycache__*",
]

[tool.setuptools.package-data]
"beetle_analyze.data" = ["*.jsonl"]
"beetle_analyze.configs" = ["*.json"]
"analyze" = ["*.json"]
"evals" = ["prompts/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
