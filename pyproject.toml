[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beetle-analyze"
version = "0.1.0"
description = "Minimal, reproducible toolkit for analysing language-model evaluation output (BLiMP-style minimal pairs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Suchir Salhan" }]
keywords = ["language-models", "evaluation", "BLiMP", "minimal-pairs", "linguistics", "reproducible"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/BeetleLM/beetle-analyze"
Repository = "https://github.com/BeetleLM/beetle-analyze"
Issues = "https://github.com/BeetleLM/beetle-analyze/issues"

[project.scripts]
beetle-analyze = "beetle_analyze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beetle_analyze.data" = ["*.jsonl"]
"beetle_analyze.configs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
